name: Release CI/CD Pipeline

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-release-notes:
    name: Generate Detailed Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog and Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Ejecución manual: no se actualiza release notes."
            exit 0
          fi

          # Buscar el tag anterior
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || "")
          
          if [ -z "$PREV_TAG" ]; then
            RANGE="${TAG_NAME}"
            HEADER="### 🚀 Primer Release: ${TAG_NAME}"
          else
            RANGE="${PREV_TAG}..${TAG_NAME}"
            HEADER="### 📦 Cambios desde ${PREV_TAG} hasta ${TAG_NAME}"
          fi

          printf "%s\n\n#### 📝 Commits incluidos en esta versión:\n" "$HEADER" > notes.md
          git log "$RANGE" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> notes.md
          printf "\n\n---\n**Full Changelog**: https://github.com/%s/commits/%s\n" "${{ github.repository }}" "$TAG_NAME" >> notes.md

          gh release edit "$TAG_NAME" --notes-file notes.md
          echo "Notas del release actualizadas con éxito."

  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Go Server
        run: go build -v -o /dev/null ./cmd/server

  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build & Typecheck Frontend
        run: npm run build

  deploy:
    name: Trigger Production Deployments
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Deploy to Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Notificando a Render para desplegar la nueva release..."
          curl -s -w "\nHTTP Status: %{http_code}\n" -X POST "$RENDER_DEPLOY_HOOK"

      - name: Deploy to Vercel
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: |
          echo "Notificando a Vercel para desplegar la nueva release..."
          curl -s -w "\nHTTP Status: %{http_code}\n" -X POST "$VERCEL_DEPLOY_HOOK"
