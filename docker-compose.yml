services:
  # ==========================================
  # 1. Base de Datos: PostgreSQL 16 Alpine
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: sinapsa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sinapsa_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sinapsa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sinapsa-network

  # ==========================================
  # 2. Backend: Go API Server & Migrations
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinapsa-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sinapsa_db}
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sinapsa-network

  # ==========================================
  # 3. Frontend: React + TS (Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinapsa-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sinapsa-network

# ==========================================
# Volúmenes y Redes
# ==========================================
volumes:
  pgdata:
    driver: local

networks:
  sinapsa-network:
    driver: bridge
